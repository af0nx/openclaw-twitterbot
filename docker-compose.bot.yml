services:
  tweet_scheduler:
    build:
      context: .
      dockerfile: Dockerfile.bot
    command: ["python3", "scripts/output/tweet_scheduler.py"]
    restart: unless-stopped
    volumes:
      - .:/app
      - /dev/shm/.env:/dev/shm/.env:ro
    mem_limit: 1500m

  twitter_poster:
    build:
      context: .
      dockerfile: Dockerfile.bot
    command: ["python3", "scripts/output/twitter_poster.py"]
    restart: unless-stopped
    volumes:
      - .:/app
      - /dev/shm/.env:/dev/shm/.env:ro
    mem_limit: 700m

  vip_hitl_bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    command: ["python3", "scripts/output/vip_hitl_telegram.py"]
    restart: unless-stopped
    volumes:
      - .:/app
      - /dev/shm/.env:/dev/shm/.env:ro
    mem_limit: 1500m

  scrapling_pool:
